<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Recruitment PKM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#230506;--panel:#38090c;--ink:#fbf1f1;--mut:#dbb5b7;--red:#d11a20;--hi:#ff9ea4;--line:#601a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--panel:#fff7f6;--ink:#240608;--mut:#6d4448;--red:#a80000;--hi:#a80000;--line:#efcfcf}}
:root[data-theme="light"]{--bg:#fff;--panel:#fff7f6;--ink:#240608;--mut:#6d4448;--red:#a80000;--hi:#a80000;--line:#efcfcf}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
h1,h2{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--hi);outline-offset:3px}
.sym{position:fixed;font:800 4.5rem "Bricolage Grotesque",serif;color:var(--line);pointer-events:none;animation:dr 7s ease-in-out infinite alternate;z-index:0}
@keyframes dr{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-24px) rotate(10deg)}}
#cL,#cR{position:fixed;top:0;bottom:0;width:50.2%;background:linear-gradient(160deg,#b00000,#5c0000);z-index:9;transition:transform 1.1s cubic-bezier(.77,0,.18,1)}
#cL{left:0}#cR{right:0;background:linear-gradient(200deg,#b00000,#5c0000)}
body.open #cL{transform:translateX(-101%)}body.open #cR{transform:translateX(101%)}
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;transition:opacity .5s,transform .7s}
body.open #intro{opacity:0;transform:scale(1.6);pointer-events:none}
.logo{width:clamp(110px,22vw,160px);border-radius:50%;box-shadow:0 0 0 5px #fff,0 12px 34px rgba(0,0,0,.5);animation:wob 3s ease-in-out infinite;margin-bottom:20px}
#intro h1{font-size:clamp(2.4rem,9vw,5.2rem);font-weight:800;letter-spacing:-.02em}
#intro h1 i{display:inline-block;font-style:normal;animation:wob 2.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-9px)}}
#intro p{max-width:34ch;margin:14px 0 30px;opacity:.9}
#go{background:#fff;color:#a80000;border:0;border-radius:999px;padding:16px 46px;font:800 1.4rem "Bricolage Grotesque",sans-serif;box-shadow:0 8px 0 rgba(0,0,0,.35);animation:pu 1.6s ease-in-out infinite;transition:transform .15s,box-shadow .15s}
#go:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
@keyframes pu{50%{transform:scale(1.07) rotate(-1.5deg)}}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:22px 18px 40px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
header img{width:46px;border-radius:50%}header h2{font-size:1.4rem;flex:1}
.today{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem}
.stage{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:26px;align-items:center}
svg.map{width:100%;height:auto;max-height:78vh;overflow:visible}
#base{fill:none;stroke:var(--line);stroke-width:12;stroke-linecap:round;stroke-dasharray:2 18}
#prog{fill:none;stroke:var(--red);stroke-width:12;stroke-linecap:round}
.node{cursor:pointer}.node circle.d{fill:var(--panel);stroke:var(--line);stroke-width:4;transition:.4s}
.node.past circle.d{fill:var(--hi);stroke:var(--hi)}.node.cur circle.d{fill:var(--red);stroke:#fff}
.node.cur circle.ring{animation:ring 1.6s ease-out infinite}
.ring{fill:none;stroke:var(--red);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.2)}}
.node text{font-family:"Bricolage Grotesque",sans-serif;fill:var(--ink)}
.node .n{font-weight:800;font-size:15px;text-anchor:middle;fill:#fff}.node.past .n{fill:#230506}
.node .l{font-weight:800;font-size:14px}.node .s{font-size:11px;fill:var(--mut);font-family:Figtree,sans-serif}
.mw{animation:sw 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.card{background:var(--panel);border:2px solid var(--line);border-left:10px solid var(--red);border-radius:6px 22px 22px 6px;padding:clamp(18px,3.5vw,32px);min-height:340px}
.card.pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translateY(24px) rotate(-2deg) scale(.94);opacity:0}}
.card h2{font-size:clamp(1.7rem,4.5vw,2.6rem);margin:8px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border-radius:999px;padding:4px 12px;font-weight:600;font-size:.85rem;border:2px solid var(--line)}
.chip.st{background:var(--red);border-color:var(--red);color:#fff}.chip.st.x{background:transparent;color:var(--mut);border-color:var(--line)}
.cd{color:var(--hi);font-weight:600;margin:6px 0}
.card ul{list-style:none;padding:0;margin:14px 0}
.card li button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:9px 4px;border-bottom:1px solid var(--line)}
.bx{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--hi);display:grid;place-items:center;transition:.25s}
.bx:after{content:"";width:6px;height:11px;border:solid #230506;border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .25s cubic-bezier(.2,1.8,.4,1)}
.ok .bx{background:var(--hi);transform:rotate(360deg)}.ok .bx:after{transform:rotate(45deg) scale(1)}
.ok span.t{text-decoration:line-through;opacity:.55}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}.bar b{display:block;height:100%;width:0;background:var(--hi);transition:width .5s}
.q{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.q button{background:transparent;border:2px solid var(--red);border-radius:12px;padding:8px 14px;font-weight:600;transition:.15s}
.q button:hover{background:var(--red);color:#fff;transform:rotate(-2deg) scale(1.05)}
#res{font-weight:600;min-height:1.5em}#res.sh{animation:shk .4s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.nav button{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:10px 24px;font-weight:600}
.nav .nx{background:var(--red);border-color:var(--red);color:#fff}.nav button:disabled{opacity:.35;cursor:default}
#cf{position:fixed;inset:0;pointer-events:none;z-index:20}
@media(max-width:820px){.stage{grid-template-columns:1fr}svg.map{max-height:46vh}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style></head>
